name: Refresh swap snapshot
on:
  schedule: [{ cron: "*/30 * * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Read the chain and compare with stoadex.com/api/stats
        run: node cli.mjs --out data/stats.json --compare
      - name: Commit the snapshot if it changed
        run: |
          git config user.name "stoa-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/stats.json
          git diff --cached --quiet || (git commit -m "Refresh swap snapshot" && git push)
